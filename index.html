<style>
  :root {
    --green: #1f8a4c;
    --ink: #333;
    --bg: #eef1ee;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    font-family: "Geeza Pro", "Tahoma", "Segoe UI", sans-serif;
    color: var(--ink);
  }

  /* شريط الأدوات */
  .toolbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center;
    padding: 10px 16px;
    background: #fff;
    border-bottom: 1px solid #d6ddd8;
  }
  .toolbar button {
    font: inherit; font-size: 14px;
    padding: 7px 14px;
    border: 1px solid var(--green);
    border-radius: 8px;
    background: #fff; color: var(--green);
    cursor: pointer;
  }
  .toolbar button.primary { background: var(--green); color: #fff; }
  .toolbar button:hover { filter: brightness(0.95); }
  .toolbar .status { font-size: 13px; color: #6b766f; min-width: 90px; }

    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }

  /* الحقول فوق القالب — المواقع بالنسبة المئوية من صورة 595×842 */
  .f {
    position: absolute;
    border: 0; background: transparent; resize: none; outline: none;
    font-family: inherit; color: var(--ink);
    font-size: 2.15cqw; line-height: 1.7;
    padding: 0 1.4cqw;
    direction: rtl; text-align: right;
  }
  .f:focus { background: rgba(31,138,76,.06); border-radius: 1.2cqw; }
  .f::placeholder { color: #a9b2ac; }
  input.f { height: 4.2%; }
  textarea.f { padding-top: 1.4cqw; overflow: hidden; }

  /* الشواهد */
  .ev {
    position: absolute;
    border-radius: 2cqw;
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .ev textarea {
    flex: 1; width: 100%;
    border: 0; background: transparent; resize: none; outline: none;
    font-family: inherit; color: var(--ink);
    font-size: 1.9cqw; line-height: 1.6; padding: 1.4cqw;
  }
  .ev textarea::placeholder { color: #a9b2ac; }
  .ev img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ev .ev-tools {
    position: absolute; bottom: 1cqw; left: 0; right: 0;
    display: flex; gap: 1cqw; justify-content: center;
  }
  .ev .ev-tools button {
    font: inherit; font-size: 1.7cqw;
    padding: .6cqw 1.6cqw;
    border: 1px solid var(--green); border-radius: 1.4cqw;
    background: rgba(255,255,255,.92); color: var(--green); cursor: pointer;
  }
  .ev.has-img textarea { display: none; }

  .hint { max-width: 794px; margin: 12px auto 0; font-size: 13px; color: #6b766f; text-align: center; }

  /* نافذة حفظ الملف (للجوال) */
  .sheet[hidden] { display: none; }
  .sheet {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(0,0,0,.4);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .sheet-box {
    width: 100%; max-width: 420px;
    background: #fff; border-radius: 16px 16px 0 0;
    padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 10px;
  }
  .sheet-title { margin: 0 0 4px; text-align: center; font-weight: bold; }
  .sheet-btn {
    display: block; text-align: center; text-decoration: none;
    font: inherit; font-size: 16px;
    padding: 12px; border-radius: 10px;
    border: 1px solid var(--green); background: #fff; color: var(--green);
  }
  .sheet-btn.primary { background: var(--green); color: #fff; }
  .sheet-btn.plain { border-color: #ccc; color: #666; }
  .sheet-btn[hidden] { display: none; }

  @page { size: A4; margin: 0; }
  @media print {
    body { background: #fff; }
    .toolbar, .hint, .ev-tools, .sheet { display: none !important; }
    .wrap { padding: 0; }
    .page { width: 210mm; height: 297mm; max-width: none; box-shadow: none; }
    .f:focus { background: transparent; }
    .f::placeholder, .ev textarea::placeholder { color: transparent; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <button class="primary" id="btnPdf">تنزيل PDF</button>
  <button id="btnPrint">طباعة</button>
  <button id="btnClear">تقرير جديد</button>
  <span class="status" id="status"></span>
  <input type="file" id="imgFile" accept="image/*" hidden>
</div>

<div class="sheet" id="pdfSheet" hidden>
  <div class="sheet-box">
    <p class="sheet-title">ملف PDF جاهز</p>
    <button class="sheet-btn primary" id="pdfShare">حفظ في الملفات / مشاركة</button>
    <a class="sheet-btn" id="pdfLink" target="_blank">فتح الملف</a>
    <button class="sheet-btn plain" id="pdfClose">إغلاق</button>
  </div>
</div>

<div class="wrap">
  <div class="page" id="page">
    <!-- العمود الأيمن -->
    <input class="f" data-k="program"  placeholder="اسم البرنامج"   style="top:19.95%; right:2.5%; width:44.5%">
    <input class="f" data-k="executor" placeholder="المنفذة"        style="top:26.4%;  right:2.5%; width:44.5%">
    <input class="f" data-k="place"    placeholder="مكان التنفيذ"   style="top:32.85%; right:2.5%; width:44.5%">
    <!-- العمود الأيسر -->
    <input class="f" data-k="date"     placeholder="تاريخ التنفيذ"  style="top:19.95%; right:52.5%; width:44.5%">
    <input class="f" data-k="duration" placeholder="مدة التنفيذ"    style="top:26.4%;  right:52.5%; width:44.5%">
    <input class="f" data-k="count"    placeholder="عدد المستفيدين" style="top:32.85%; right:52.5%; width:44.5%">

    <textarea class="f" data-k="steps" placeholder="خطوات التنفيذ — كل خطوة في سطر"
      style="top:42.2%; right:2.6%; width:44.6%; height:17.8%"></textarea>
    <textarea class="f" data-k="goals" placeholder="الأهداف — كل هدف في سطر"
      style="top:42.2%; right:52.8%; width:44.3%; height:17.8%"></textarea>

    <!-- الشواهد (من اليمين لليسار) -->
    <div class="ev" data-i="0" style="top:66.8%; right:2.6%;  width:22.6%; height:25.3%"></div>
    <div class="ev" data-i="1" style="top:66.8%; right:26.9%; width:22.8%; height:25.3%"></div>
    <div class="ev" data-i="2" style="top:66.8%; right:51.2%; width:22.8%; height:25.3%"></div>
    <div class="ev" data-i="3" style="top:66.8%; right:75.6%; width:22.8%; height:25.3%"></div>
  </div>
  <p class="hint">اكتب مباشرة في الحقول. يُحفظ العمل تلقائياً في هذا المتصفح.</p>

</div>

<script>
(function () {
  var KEY = "amal-report-v1";
  var state = { fields: {}, ev: [{}, {}, {}, {}] };
  var statusEl = document.getElementById("status");
  var saveTimer;

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) state = JSON.parse(raw);
    } catch (e) {}
    if (!state.ev) state.ev = [{}, {}, {}, {}];
  }

  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try {
        localStorage.setItem(KEY, JSON.stringify(state));
        flash("تم الحفظ");
      } catch (e) {
        flash("تعذّر الحفظ التلقائي (الصور كبيرة) — استخدم التصدير");
      }
    }, 400);
  }

  function flash(msg) {
    statusEl.textContent = msg;
    clearTimeout(flash.t);
    flash.t = setTimeout(function () { statusEl.textContent = ""; }, 2500);
  }

  // الحقول النصية
  var fields = document.querySelectorAll(".f");
  function fillFields() {
    fields.forEach(function (el) { el.value = state.fields[el.dataset.k] || ""; });
  }
  fields.forEach(function (el) {
    el.addEventListener("input", function () {
      state.fields[el.dataset.k] = el.value;
      save();
    });
  });

  // الشواهد
  var imgInput = document.getElementById("imgFile");
  var pendingSlot = null;

  function renderEv() {
    document.querySelectorAll(".ev").forEach(function (box) {
      var i = +box.dataset.i;
      var d = state.ev[i] || (state.ev[i] = {});
      box.innerHTML = "";
      box.classList.toggle("has-img", !!d.img);
      if (d.img) {
        var img = document.createElement("img");
        img.src = d.img;
        box.appendChild(img);
      }
      var ta = document.createElement("textarea");
      ta.placeholder = "أدرج الشاهد أو اكتب هنا…";
      ta.value = d.text || "";
      ta.addEventListener("input", function () { d.text = ta.value; save(); });
      box.appendChild(ta);

      var tools = document.createElement("div");
      tools.className = "ev-tools";
      var add = document.createElement("button");
      add.textContent = d.img ? "تغيير الصورة" : "إضافة صورة";
      add.onclick = function () { pendingSlot = i; imgInput.value = ""; imgInput.click(); };
      tools.appendChild(add);
      if (d.img) {
        var del = document.createElement("button");
        del.textContent = "حذف";
        del.onclick = function () { delete d.img; save(); renderEv(); };
        tools.appendChild(del);
      }
      box.appendChild(tools);
    });
  }

  // تصغير الصورة قبل حفظها حتى لا تمتلئ مساحة المتصفح
  function shrink(file, cb) {
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var max = 900, w = img.width, h = img.height;
        var s = Math.min(1, max / Math.max(w, h));
        var c = document.createElement("canvas");
        c.width = Math.round(w * s); c.height = Math.round(h * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        cb(c.toDataURL("image/jpeg", 0.82));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  imgInput.addEventListener("change", function () {
    var file = imgInput.files[0];
    if (!file || pendingSlot === null) return;
    var slot = pendingSlot;
    shrink(file, function (url) {
      state.ev[slot].img = url;
      save(); renderEv();
    });
  });

  // الأزرار
  // تنزيل PDF: نرسم الصفحة على لوحة (canvas) بالخط الأصلي للجهاز حتى تتصل الحروف العربية،
  // ثم نضع الصورة في ملف PDF بحجم A4 — بدون أي مكتبات خارجية
  var btnPdf = document.getElementById("btnPdf");

  function loadImg(src) {
    return new Promise(function (res, rej) {
      var im = new Image();
      im.onload = function () { res(im); };
      im.onerror = rej;
      im.src = src;
    });
  }

  function wrapLines(ctx, text, maxW) {
    var out = [];
    text.split("\n").forEach(function (para) {
      var words = para.split(/\s+/).filter(Boolean), line = "";
      if (!words.length) { out.push(""); return; }
      words.forEach(function (w) {
        var test = line ? line + " " + w : w;
        if (line && ctx.measureText(test).width > maxW) { out.push(line); line = w; }
        else line = test;
      });
      out.push(line);
    });
    return out;
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function renderPage() {
    var page = document.getElementById("page");
    var pr = page.getBoundingClientRect();
    var W = 1588, H = Math.round(W * 842 / 595), k = W / pr.width;
    var c = document.createElement("canvas");
    c.width = W; c.height = H;
    var ctx = c.getContext("2d");
    var bg = getComputedStyle(page).backgroundImage.replace(/^url\(["']?/, "").replace(/["']?\)$/, "");

    function box(el) {
      var r = el.getBoundingClientRect(), cs = getComputedStyle(el);
      return {
        x: (r.left - pr.left) * k, y: (r.top - pr.top) * k, w: r.width * k, h: r.height * k,
        size: parseFloat(cs.fontSize) * k, lh: parseFloat(cs.lineHeight) * k,
        padR: parseFloat(cs.paddingRight) * k, padL: parseFloat(cs.paddingLeft) * k,
        padT: parseFloat(cs.paddingTop) * k, family: cs.fontFamily, color: cs.color
      };
    }

    function drawText(el, text, single) {
      if (!text) return;
      var b = box(el);
      ctx.save();
      ctx.font = b.size + "px " + b.family;
      ctx.fillStyle = b.color;
      ctx.direction = "rtl";
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      var xr = b.x + b.w - b.padR;
      if (single) {
        ctx.fillText(text, xr, b.y + b.h / 2);
      } else {
        ctx.beginPath(); ctx.rect(b.x, b.y, b.w, b.h); ctx.clip();
        wrapLines(ctx, text, b.w - b.padR - b.padL).forEach(function (line, i) {
          ctx.fillText(line, xr, b.y + b.padT + b.lh * (i + 0.5));
        });
      }
      ctx.restore();
    }

    return loadImg(bg).then(function (bgImg) {
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
      ctx.drawImage(bgImg, 0, 0, W, H);

      document.querySelectorAll("#page .f").forEach(function (el) {
        drawText(el, el.value.trim(), el.tagName === "INPUT");
      });

      var jobs = [];
      document.querySelectorAll("#page .ev").forEach(function (ev) {
        var d = state.ev[+ev.dataset.i] || {};
        if (d.img) {
          jobs.push(loadImg(d.img).then(function (im) {
            var b = box(ev);
            var s = Math.max(b.w / im.width, b.h / im.height);
            var iw = im.width * s, ih = im.height * s;
            ctx.save();
            roundRect(ctx, b.x, b.y, b.w, b.h, parseFloat(getComputedStyle(ev).borderTopLeftRadius) * k);
            ctx.clip();
            ctx.drawImage(im, b.x + (b.w - iw) / 2, b.y + (b.h - ih) / 2, iw, ih);
            ctx.restore();
          }));
        } else {
          var ta = ev.querySelector("textarea");
          if (ta) drawText(ta, ta.value.trim(), false);
        }
      });
      return Promise.all(jobs).then(function () { return c; });
    });
  }

  // ملف PDF بسيط من صفحة واحدة تحتوي صورة JPEG
  function jpegToPdf(dataUrl, w, h) {
    var bin = atob(dataUrl.split(",")[1]);
    var jpg = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) jpg[i] = bin.charCodeAt(i);

    var parts = [], offsets = [], len = 0;
    function add(x) {
      var u = typeof x === "string" ? new TextEncoder().encode(x) : x;
      parts.push(u); len += u.length;
    }
    function obj(n, body) { offsets[n] = len; add(n + " 0 obj\n" + body + "\nendobj\n"); }

    var PW = 595.28, PH = 841.89;
    var content = "q " + PW + " 0 0 " + PH + " 0 0 cm /Im0 Do Q";
    add("%PDF-1.4\n");
    obj(1, "<< /Type /Catalog /Pages 2 0 R >>");
    obj(2, "<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
    obj(3, "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + PW + " " + PH + "] " +
           "/Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>");
    offsets[4] = len;
    add("4 0 obj\n<< /Type /XObject /Subtype /Image /Width " + w + " /Height " + h +
        " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + jpg.length + " >>\nstream\n");
    add(jpg);
    add("\nendstream\nendobj\n");
    obj(5, "<< /Length " + content.length + " >>\nstream\n" + content + "\nendstream");

    var xref = len, x = "xref\n0 6\n0000000000 65535 f \n";
    for (var n = 1; n <= 5; n++) x += String(offsets[n]).padStart(10, "0") + " 00000 n \n";
    add(x + "trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n" + xref + "\n%%EOF");
    return new Blob(parts, { type: "application/pdf" });
  }

  // في الآيفون والآيباد لا يبدأ التنزيل تلقائياً بعد إنشاء الملف،
  // لذلك نعرض نافذة فيها أزرار يضغطها المستخدم بنفسه
  var isTouch = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var downloads = null;
  if (window.claude && window.claude.use) {
    window.claude.use("downloads").then(function (d) { downloads = d; }, function () {});
  }
  var sheet = document.getElementById("pdfSheet");
  var sheetUrl = null;

  function closeSheet() {
    sheet.hidden = true;
    if (sheetUrl) { URL.revokeObjectURL(sheetUrl); sheetUrl = null; }
  }
  document.getElementById("pdfClose").onclick = closeSheet;

  function showSheet(blob, fileName) {
    sheetUrl = URL.createObjectURL(blob);
    var link = document.getElementById("pdfLink");
    link.href = sheetUrl;
    link.download = fileName;
    var shareBtn = document.getElementById("pdfShare");
    var file = new File([blob], fileName, { type: "application/pdf" });
    var canShare = navigator.canShare && navigator.canShare({ files: [file] });
    shareBtn.hidden = !canShare;
    shareBtn.onclick = function () {
      navigator.share({ files: [file], title: fileName }).catch(function () {});
    };
    sheet.hidden = false;
  }

  btnPdf.onclick = function () {
    btnPdf.disabled = true;
    flash("جارٍ إنشاء الملف…");
    renderPage().then(function (canvas) {
      var blob = jpegToPdf(canvas.toDataURL("image/jpeg", 0.92), canvas.width, canvas.height);
      var name = (state.fields.program || "تقرير").replace(/[\\/:*?"<>|]/g, "") + ".pdf";
      // عند فتح الأداة من رابطها في Claude: نسلّم الملف للتطبيق ليحفظه (يعمل على الآيفون)
      if (downloads) {
        return downloads.save({ filename: name, data: blob }).then(function () {
          flash("تم التنزيل");
        }, function (err) {
          if (err && err.code === "declined") { flash(""); return; }
          showSheet(blob, name);
        });
      }
      if (isTouch) { showSheet(blob, name); flash(""); return; }
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
      flash("تم التنزيل");
    }).catch(function () {
      alert("حدث خطأ أثناء إنشاء ملف PDF.");
    }).then(function () { btnPdf.disabled = false; });
  };

  // الطباعة من نافذة الآيفون تسمح بحفظ التقرير PDF عبر زر المشاركة
  document.getElementById("btnPrint").onclick = function () { window.print(); };

  document.getElementById("btnClear").onclick = function () {
    if (!confirm("بدء تقرير جديد؟ سيتم مسح جميع البيانات الحالية.")) return;
    state = { fields: {}, ev: [{}, {}, {}, {}] };
    try { localStorage.removeItem(KEY); } catch (e) {}
    fillFields(); renderEv(); flash("تم المسح");
  };

  load(); fillFields(); renderEv();
})();
</script>
</body>
</html>
